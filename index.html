<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product List with Cart</title>
        <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
        <link rel="stylesheet" href="styles/product-list-with-cart.css">
    </head>
    <body>
        <div class="product-list-with-cart">
            <main class="product-list">
                <h1>Desserts</h1>
                <div class="list"></div>
            </main>
            <aside class="cart">
                <h2>Your Cart (<span class="cart-items">0</span>)</h2>
                <div class="empty-placeholder">
                    <img class="empty-illustration" src="images/illustration-empty-cart.svg" alt="">
                    <p>Your added items will appear here</p>
                </div>
                <div class="added-items hidden"></div>
            </aside>
        </div>
        <div class="confirmation-modal hidden" aria-hidden="true">
            <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
                <div class="title-info">
                    <img src="images/icon-order-confirmed.svg" alt="">
                    <div class="confirmation-text">
                        <h2 id="modal-title">Order Confirmed</h2>
                        <p>We hope you enjoy your food!</p>
                    </div>
                    <div class="confirmed-items"></div>
                    <button class="start-new-order" type="button">
                        Start New Order
                    </button>
                </div>
            </div>
        </div>
        <script type="module" src="scripts/index.js"></script> 
    </body>
</html>
